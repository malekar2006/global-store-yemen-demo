<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="جلوبال ستور - نسخة المعاينة التجريبية" />
  <title>جلوبال ستور | النسخة التجريبية</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">G</span><div><strong>جلوبال ستور</strong><small>Global Store</small></div></div>
      <nav id="mainNav" aria-label="التنقل الرئيسي">
        <button class="nav-item active" data-view="dashboard">لوحة التحكم</button>
        <button class="nav-item" data-view="pos">نقطة البيع</button>
        <button class="nav-item" data-view="inventory">المخزون و IMEI</button>
        <button class="nav-item" data-view="orders">الطلبات والفواتير</button>
        <button class="nav-item" data-view="warranty">الضمان والصيانة</button>
        <button class="nav-item" data-view="finance">المحاسبة</button>
        <button class="nav-item" data-view="settings">الإعدادات</button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span> وضع المعاينة التجريبية</div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div><span class="eyebrow">نظام إدارة المتجر</span><h1 id="pageTitle">لوحة التحكم</h1></div><div class="top-actions"><button id="langBtn" class="ghost-btn">EN</button><button id="themeBtn" class="ghost-btn" aria-label="تغيير الوضع">◐</button><div class="user-chip"><span class="avatar">م</span><span>مالك النظام<small>مدير عام</small></span></div></div></header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
